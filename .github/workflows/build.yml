name: build

# Face ID for Mac (by PK): builds the unsigned app on a GitHub macOS runner (Xcode 26 lives there).
# Signing happens later on Pavel's Mac with his own long-lived certificate — no secrets in this public repo.
# Version = time of the commit: CFBundleShortVersionString YYYY.MMDD.HHMM (Kyiv, what the user sees),
# CFBundleVersion YYYYMMDDHHMM in UTC (monotonic, immune to DST).

"on":
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Core logic tests
        if: hashFiles('Package.swift') != ''
        run: swift test

      - name: Version from commit time
        id: ver
        run: |
          TS=$(git log -1 --format=%ct)
          echo "short=$(TZ=Europe/Kyiv date -r $TS '+%Y.%m%d.%H%M' | sed -E 's/\.0*([0-9])/.\1/g')" >> $GITHUB_OUTPUT
          echo "build=$(TZ=UTC date -r $TS '+%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          echo "display=$(TZ=Europe/Kyiv date -r $TS '+%d.%m.%Y %H:%M')" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project glance.xcodeproj -target glance -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="${{ steps.ver.outputs.short }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            PK_DISPLAY_VERSION="${{ steps.ver.outputs.display }}" \
            PK_COMMIT="${{ steps.ver.outputs.commit }}" \
            SYMROOT="$PWD/build" build 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
          test -x "build/Release/Face ID for Mac.app/Contents/MacOS/Face ID for Mac"

      - name: Safety checks on the binary
        run: |
          APP="build/Release/Face ID for Mac.app"
          BIN="$APP/Contents/MacOS/Face ID for Mac"
          if otool -L "$BIN" | grep -i sparkle; then echo "Sparkle still linked"; exit 1; fi
          if [ -d "$APP/Contents/Frameworks/Sparkle.framework" ]; then echo "Sparkle embedded"; exit 1; fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" -c "Print :PKBuildDisplayVersion" "$APP/Contents/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$APP/Contents/Info.plist" 2>/dev/null; then echo "update feed present"; exit 1; fi

      - name: Sign (ad-hoc) and package DMG
        id: pkg
        run: |
          set -e
          APP="build/Release/Face ID for Mac.app"
          # Ad-hoc signature with the hardened runtime and the camera entitlement only — no certificate or key is
          # created or stored anywhere. Trade-off: macOS ties permissions of an ad-hoc app to this exact build, so
          # after an update the owner re-ticks Camera / Accessibility / Input Monitoring once.
          codesign --force --options runtime --timestamp=none --entitlements glance/glance.entitlements -s - "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q camera
          V="${{ steps.ver.outputs.short }}"
          mkdir -p dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
          DMG="Face-ID-for-Mac-$V.dmg"
          hdiutil create -volname "Face ID for Mac" -srcfolder dmgroot -fs HFS+ -format UDZO -ov "$DMG" >/dev/null
          shasum -a 256 "$DMG" | tee SHA256.txt
          echo "dmg=$DMG" >> $GITHUB_OUTPUT

      # Delivered as a workflow artifact (download needs a signed-in GitHub account), not as a public release.
      - uses: actions/upload-artifact@v4
        with:
          name: Face-ID-for-Mac-${{ steps.ver.outputs.short }}
          path: |
            ${{ steps.pkg.outputs.dmg }}
            SHA256.txt
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
